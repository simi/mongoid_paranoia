name: CI RSpec Test

on: [push, pull_request]

jobs:
  build:
    name: ruby ${{ matrix.ruby }} / mongoid ${{ matrix.mongoid }}
    env:
      CI: true
      TESTOPTS: -v
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '3.4']
        mongoid: [7, 8, 9]
        experimental: [false]
        include:
          - ruby: '4.0'
            mongoid: 9
            experimental: false
          - ruby: head
            mongoid: head
            experimental: true
          - ruby: jruby
            mongoid: 8
            experimental: true
          - ruby: jruby
            mongoid: 9
            experimental: true
          - ruby: jruby-head
            mongoid: 9
            experimental: true
          - ruby: truffleruby
            mongoid: 9
            experimental: true
          - ruby: truffleruby-head
            mongoid: 9
            experimental: true

    steps:
      - name: repo checkout
        uses: actions/checkout@v2

      - name: start mongodb
        uses: supercharge/mongodb-github-action@1.6.0
        with:
          mongodb-version: 4.4
          mongodb-replica-set: rs0

      - name: load ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: 2

      - name: bundle install
        run:  bundle install --jobs 4 --retry 3
        env:
          MONGOID_VERSION: ${{ matrix.mongoid }}

      - name: test
        timeout-minutes: 10
        run: bundle exec rake spec
        continue-on-error: ${{ matrix.experimental }}
        env:
          MONGOID_VERSION: ${{ matrix.mongoid }}
